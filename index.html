    // =====================================================================
    // BUILD TREE
    // =====================================================================
    function buildTree(container, nodes, parentPath) {
        nodes.forEach(node => {
            const wrapper = document.createElement('div');
            wrapper.className = 'tree-node';
            
            const content = document.createElement('div');
            content.className = 'tree-node-content';
            content.dataset.taskId = node.id;
            content.dataset.path = (parentPath ? parentPath + ' > ' : '') + node.name;
            
            const hasChildren = node.children && node.children.length > 0;
            const toggle = document.createElement('span');
            toggle.className = 'toggle' + (hasChildren ? '' : '');
            toggle.textContent = hasChildren ? '▶' : '';
            if (hasChildren) toggle.style.visibility = 'visible';
            else toggle.style.visibility = 'hidden';
            content.appendChild(toggle);
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'node-name';
            nameSpan.textContent = node.name;
            content.appendChild(nameSpan);
            
            wrapper.appendChild(content);
            
            // Click to scroll to section
            content.addEventListener('click', (e) => {
                e.stopPropagation();

                // --- CANCEL SEARCH if clicking a non-highlighted node ---
                if (!content.classList.contains('search-active')) {
                    const si = document.getElementById('search-input');
                    if (si) { si.value = ''; }
                    document.querySelectorAll('.tree-node-content').forEach(el => el.classList.remove('search-active'));
                    searchResults = []; currentSearchIndex = -1;
                }

                // --- PATH HIGHLIGHTING ---
                // Clear all active classes
                document.querySelectorAll('.tree-node-content').forEach(el => el.classList.remove('active', 'active-ancestor'));
                // Get the path from data-path attribute and highlight each node in the path
                const path = content.dataset.path;
                if (path) {
                    const pathParts = path.split(' > ');
                    for (let i = 0; i < pathParts.length; i++) {
                        const partialPath = pathParts.slice(0, i + 1).join(' > ');
                        document.querySelectorAll('.tree-node-content').forEach(el => {
                            if (el.dataset.path === partialPath) {
                                if (i === pathParts.length - 1) el.classList.add('active');
                                else el.classList.add('active-ancestor');
                            }
                        });
                    }
                } else {
                    content.classList.add('active');
                }

                // --- SINGLE BRANCH DISPLAY ---
                // Show only this node's OWN article, not its descendants
                document.querySelectorAll('.article-card').forEach(card => {
                    card.style.display = card.dataset.task === node.id ? '' : 'none';
                });
                // Scroll to this section
                const section = document.getElementById('section-' + node.id);
                if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });

                // Toggle expand/collapse
                if (hasChildren) {
                    const childContainer = wrapper.querySelector('.tree-children');
                    if (childContainer) {
                        childContainer.classList.toggle('open');
                        toggle.classList.toggle('expanded');
                        toggle.textContent = childContainer.classList.contains('open') ? '▾' : '▶';
                    }
                }
            });
            
            if (hasChildren) {
                const childContainer = document.createElement('div');
                childContainer.className = 'tree-children';
                buildTree(childContainer, node.children, (parentPath ? parentPath + ' > ' : '') + node.name);
                wrapper.appendChild(childContainer);
            }
            
            container.appendChild(wrapper);
        });
    }

    // =====================================================================
    // GENERATE ARTICLES
    // =====================================================================
    function generateArticles() {
        const mainContent = document.getElementById('main-content');
        
        // Collect all task IDs in order from treeData
        const taskOrder = [];
        function collectIds(nodes) {
            nodes.forEach(n => {
                taskOrder.push(n.id);
                if (n.children) collectIds(n.children);
            });
        }
        collectIds(treeData);
        
        taskOrder.forEach(taskId => {
            const data = taskContent[taskId];
            if (!data) return;
            
            const section = document.createElement('section');
            section.id = 'section-' + taskId;
            section.className = 'article-card';
            section.dataset.task = taskId;
            
            const h2 = document.createElement('h2');
            h2.textContent = data.title;
            section.appendChild(h2);
            
            const body = document.createElement('div');
            body.className = 'article-body';
            
            // Intro paragraph
            if (data.intro) {
                const p = document.createElement('p');
                p.textContent = data.intro;
                body.appendChild(p);
            }
            
            // Slides (image-text pairs)
            if (data.slides && data.slides.length > 0) {
                data.slides.forEach((slide, idx) => {
                    if (slide.image) {
                        const imgDiv = document.createElement('div');
                        imgDiv.className = 'article-image';
                        const img = document.createElement('img');
                        img.src = slide.image;
                        img.alt = data.title + ' 截图 ' + (idx + 1);
                        img.loading = 'lazy';
                        img.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openFullscreenViewer(taskId, idx);
                        });
                        imgDiv.appendChild(img);
                        body.appendChild(imgDiv);
                    }
                    if (slide.text) {
                        const textDiv = document.createElement('div');
                        textDiv.className = 'article-text';
                        textDiv.innerHTML = slide.text;
                        body.appendChild(textDiv);
                    }
                });
            }
            
            // Action link
            if (data.action && data.action.text && data.action.url) {
                const a = document.createElement('a');
                a.href = data.action.url;
                a.target = '_blank';
                a.className = 'action-link';
                a.textContent = data.action.text;
                body.appendChild(a);
            }
            
            // Warnings
            if (data.warnings) {
                data.warnings.forEach(w => {
                    const wDiv = document.createElement('div');
                    wDiv.className = 'article-text';
                    wDiv.style.borderLeftColor = '#f44336';
                    wDiv.innerHTML = '<span class="highlight-red">⚠ ' + w + '</span>';
                    body.appendChild(wDiv);
                });
            }
            
            section.appendChild(body);
            mainContent.appendChild(section);
        });
    }

    // =====================================================================
    // ACTIVE SECTION TRACKING
    // =====================================================================
    function setupScrollSpy() {
        const mainContent = document.getElementById('main-content');
        const sections = mainContent.querySelectorAll('.article-card');
        const treeNodes = document.querySelectorAll('.tree-node-content');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const taskId = entry.target.dataset.task;
                    treeNodes.forEach(node => {
                        node.classList.toggle('active', node.dataset.taskId === taskId);
                    });
                }
            });
        }, { root: mainContent, threshold: 0.3 });
        
        sections.forEach(s => observer.observe(s));
    }

    // =====================================================================
    // SERVER STATUS
    // =====================================================================
    const RATE_LIMIT_WINDOW_MS = 5 * 60 * 1000;
    const RATE_LIMIT_MAX_CALLS = 50;
    const RATE_LIMIT_STORAGE_KEY = 'sc_api_rate_limit';

    function checkRateLimit() {
        const now = Date.now();
        let record;
        try { record = JSON.parse(localStorage.getItem(RATE_LIMIT_STORAGE_KEY) || 'null'); } catch(e) { record = null; }
        if (!record || !record.windowStart || (now - record.windowStart > RATE_LIMIT_WINDOW_MS)) {
            record = { windowStart: now, count: 0 };
        }
        if (record.count >= RATE_LIMIT_MAX_CALLS) return false;
        record.count++;
        localStorage.setItem(RATE_LIMIT_STORAGE_KEY, JSON.stringify(record));
        return true;
    }

    async function fetchWithTimeout(url, options, timeout) {
        timeout = timeout || 10000;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);
        const fetchOpts = { ...options, signal: controller.signal };
        if (!fetchOpts.headers) fetchOpts.headers = {};
        if (!fetchOpts.headers['Accept'] && typeof url === 'string' && !url.includes('graphql')) {
            fetchOpts.headers = { ...fetchOpts.headers, 'Accept': 'application/json' };
        }
        const response = await fetch(url, fetchOpts);
        clearTimeout(timeoutId);
        return response;
    }

    function getStatusLabel(status) {
        const labels = { 'operational':'正常运行', 'degraded':'性能下降', 'partial_outage':'部分中断', 'major_outage':'重大故障', 'maintenance':'维护中', 'under_maintenance':'维护中', 'offline':'离线' };
        return labels[status] || status;
    }

    async function updateServerStatus() {
        const platformEl = document.getElementById('status-platform');
        const puEl = document.getElementById('status-pu');
        const acEl = document.getElementById('status-ac');
        if (!checkRateLimit()) return;

        try {
            if (location.protocol === 'file:') throw new Error('请部署后使用');
            const response = await fetchWithTimeout('/api/server-status', {}, 8000);
            if (!response.ok) throw new Error('获取失败');
            const data = await response.json();
            const systems = data.systems || [];
            
            const indicators = {
                'platform': platformEl,
                'persistent universe': puEl,
                'arena commander': acEl
            };
            
            // Reset all to green
            Object.values(indicators).forEach(el => {
                if (el) { el.style.background = '#4CAF50'; el.style.boxShadow = '0 0 6px #4CAF50'; el.className = 'ss-indicator'; }
            });
            
            systems.forEach(sys => {
                const name = (sys.name || '').toLowerCase();
                const el = indicators[name];
                if (!el) return;
                if (sys.status === 'operational') {
                    el.style.background = '#4CAF50'; el.style.boxShadow = '0 0 6px #4CAF50'; el.className = 'ss-indicator';
                } else if (sys.status === 'degraded' || sys.status === 'partial_outage') {
                    el.style.background = '#a855f7'; el.style.boxShadow = '0 0 6px #a855f7'; el.className = 'ss-indicator degraded';
                } else if (sys.status === 'major_outage' || sys.status === 'offline') {
                    el.style.background = '#f44336'; el.style.boxShadow = '0 0 6px #f44336'; el.className = 'ss-indicator offline';
                } else if (sys.status === 'maintenance' || sys.status === 'under_maintenance') {
                    el.style.background = '#ffc107'; el.style.boxShadow = '0 0 6px #ffc107'; el.className = 'ss-indicator warn';
                } else {
                    el.style.background = '#888'; el.style.boxShadow = '0 0 6px #888'; el.className = 'ss-indicator unknown';
                }
                // Restore tooltip: set data-tooltip on the indicator's parent status item
                const label = getStatusLabel(sys.status);
                const statusItem = el.closest('.ss-status-item') || el.parentElement;
                statusItem.setAttribute('data-tooltip', sys.name + ': ' + label);
            });
        } catch (error) {
            console.error('Server status error:', error);
            [platformEl, puEl, acEl].forEach(el => {
                if (el) { el.style.background = '#666'; el.style.boxShadow = '0 0 6px #666'; el.className = 'ss-indicator unknown'; }
            });
        }
    }

    function scheduleServerUpdate() {
        updateServerStatus();
        setInterval(() => {
            const delay = Math.floor(Math.random() * 120000) + 300000;
            setTimeout(() => { updateServerStatus(); }, delay);
        }, 600000);
    }

    function formatFundingAmount(amount) {
        if (!amount) return '获取失败';
        if (amount >= 100000000) return '$' + (amount / 100000000).toFixed(2) + '亿';
        if (amount >= 10000) return '$' + (amount / 10000).toFixed(2) + '万';
        return '$' + Number(amount).toLocaleString();
    }

    function formatBackersCount(count) {
        if (!count) return '获取失败';
        if (count >= 100000000) return (count / 100000000).toFixed(2) + '亿';
        if (count >= 10000) return (count / 10000).toFixed(2) + '万';
        return Number(count).toLocaleString();
    }

    async function updateFundingStats() {
        const fundingEl = document.getElementById('funding-amount');
        const backersEl = document.getElementById('backers-count');

        if (!checkRateLimit()) return;

        try {
            if (location.protocol === 'file:') throw new Error();
            const b = JSON.stringify({ chart: 'day', fans: true, funds: true, alpha_slots: true, fleet: true });
            const r = await fetchWithTimeout('/api/crowdfund-stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: b }, 15000);
            if (r.ok) {
                const j = await r.json();
                if (j?.data) {
                    if (fundingEl) fundingEl.textContent = formatFundingAmount(j.data.funds / 100);
                    if (backersEl) backersEl.textContent = formatBackersCount(j.data.fans);
                    return;
                }
            }
            throw new Error();
        } catch(e) {
            console.error('Funding stats error:', e);
            if (fundingEl && fundingEl.textContent === '加载中...') fundingEl.textContent = '获取失败';
            if (backersEl && backersEl.textContent === '加载中...') backersEl.textContent = '获取失败';
        }
    }

    async function updateFestivalCountdown() {
        const el = document.getElementById('festival-btn');
        if (!el) return;
        try {
            let data = null;
            try { const r = await fetch('https://eahi.org/api/eventsTracker/zh/'); if (r.ok) data = await r.json(); } catch(e) {}
            if (!data?.data?.length) { el.innerHTML = '🎉 暂无数据'; return; }
            const now = new Date();
            const festivalMap = {
                'Red Festival': '火红节', 'Coramor': '科拉爱人节', 'Stella Fortuna': '幸运星节',
                'Alien Week': '外星周', 'Foundation Festival': '奠基节', 'Pirate Week': '海盗周',
                'Intergalactic Aerospace Expo (IAE)': '周年庆IAE', 'Luminalia': '光灯节',
                'Invictus Launch Week (ILW)': '舰队周ILW'
            };
            let items = data.data.filter(e => festivalMap[e.en]).map(e => ({
                name: festivalMap[e.en], start: new Date(e.start), end: new Date(e.end),
                md: { m: new Date(e.start).getMonth() + 1, d: new Date(e.start).getDate() }
            }));
            let future = items.filter(e => e.end > now).sort((a, b) => a.start - b.start);
            let all = future.map(ev => ({ n: ev.name, d: Math.ceil((ev.start - now) / 86400000) }));
            let pastItems = items.filter(e => e.end <= now);
            const seen = new Set();
            pastItems.forEach(ev => {

                let nd = new Date(now.getFullYear(), ev.md.m - 1, ev.md.d);

                all.push({ n: ev.name, d: Math.ceil((nd - now) / 86400000), p: true });
            });
            all.sort((a, b) => a.d - b.d);
            if (!all.length) { el.innerHTML = '🎉 暂无数据'; return; }

    const NOTE_FREQUENCIES = {
        'C2':65.41,'D2':73.42,'E2':82.41,'F2':87.31,'G2':98.00,'A2':110.00,'B2':123.47,
        'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'B3':246.94,
        'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'B4':493.88,
        'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880.00,'B5':987.77,
        'C6':1046.50,'D6':1174.66,'E6':1318.51,'F6':1396.91,'G6':1567.98,'A6':1760.00,'B6':1975.53,
    };

    function getExtendedChord(rootNote, type) {
        type = type || 'maj7';
        const root = NOTE_FREQUENCIES[rootNote];
        if (!root) return [];
        const intervals = { maj7: [root, root*1.2599, root*1.4983, root*1.8877], min7: [root, root*1.1892, root*1.4983, root*1.7818], sus4: [root, root*1.3348, root*1.4983] };
        return intervals[type] || [root];
    }

    function playChord(notes, time, duration, velocity, filterFreq, qValue) {
        velocity = velocity || 1; filterFreq = filterFreq || 1500; qValue = qValue || 1.0;
        currentHarmonyNotes.forEach(osc => { try { osc.stop(); } catch(e) {} });
        currentHarmonyNotes = [];
        notes.forEach((noteFreq, index) => {
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            osc.type = index % 3 === 0 ? 'sawtooth' : (index % 3 === 1 ? 'square' : 'triangle');
            osc.frequency.value = noteFreq * (1 + (index * 0.001));
            const maxVol = (0.12 * velocity) / notes.length;
            const noteDelay = (index * duration) / (notes.length * 3);
            gainNode.gain.setValueAtTime(0, time + noteDelay);
            gainNode.gain.linearRampToValueAtTime(maxVol, time + noteDelay + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(maxVol * 0.6, time + noteDelay + duration * 0.4);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + noteDelay + duration);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(filterFreq, time + noteDelay);
            filter.Q.setValueAtTime(qValue, time + noteDelay);
            filter.frequency.exponentialRampToValueAtTime(filterFreq * 0.8, time + noteDelay + duration);
            osc.connect(gainNode); gainNode.connect(filter); filter.connect(trackGains.harmony);
            osc.start(time + noteDelay); osc.stop(time + noteDelay + duration);
            currentHarmonyNotes.push(osc);
            allSourceNodes.add(osc);
        });
    }

    const DRUM_PATTERNS = {
        intro: [1,0,0,0,0,0,0,0],
        buildup: [[1,0,2,0,1,0,2,0],[1,3,2,3,1,3,2,3],[1,4,2,0,1,4,2,0]],
        outro: [1,0,2,0,0,0,2,0]
    };

    function playDrumsForBeat(beatIndex, time) {
        if (currentPhase === Phases.BUILDUP) {
            const pattern = DRUM_PATTERNS.buildup;
            const row = Math.floor(beatIndex / 8) % pattern.length;
            const step = beatIndex % 8;
            const inst = pattern[row][step];
            if (inst & 1) drumKit.kick(time);
            if (inst & 2) drumKit.snare(time);
            if (inst & 4) { if (Math.random() > 0.6) drumKit.hihat_open(time, 0.5); else drumKit.hihat_closed(time, 0.6); }
        } else if (currentPhase === Phases.OUTRO) {
            const step = beatIndex % 8;
            const inst = DRUM_PATTERNS.outro[step];
            if (inst & 1) drumKit.kick(time);
            if (inst & 2) drumKit.snare(time);
            if (inst & 4) { if (Math.random() > 0.6) drumKit.hihat_open(time, 0.5); else drumKit.hihat_closed(time, 0.6); }
        } else {
            const step = beatIndex % 8;
            if (DRUM_PATTERNS.intro[step] & 1) drumKit.kick(time);
        }
    }

    function startSyntheticMusic() {
        if (isMusicPlaying) return;
        initAudio();
        if (audioContext.state === 'suspended') audioContext.resume();
        else if (audioContext.state === 'closed') { audioContext = null; initAudio(); audioContext.resume(); }
        isMusicPlaying = true;
        document.getElementById('music-control')?.classList.add('rotating');
        phaseStartTime = audioContext.currentTime;
        currentPhase = Phases.INTRO;
        currentBeat = 0;
        lastBeatTime = audioContext.currentTime;
        harmonyUpdateCounter = 0;

        function loop() {
            if (!isMusicPlaying) return;
            const now = audioContext.currentTime;
            elapsedTime = now - phaseStartTime;
            if (now >= lastBeatTime + beatInterval) {
                currentBeat++;
                lastBeatTime = now;
                if (currentPhase === Phases.BUILDUP) beatInterval = 0.4;
                else if (currentPhase === Phases.OUTRO) beatInterval = 0.55;
                else beatInterval = 0.7;
                playDrumsForBeat(currentBeat, now);
                harmonyUpdateCounter++;
                let updateInterval = currentPhase === Phases.INTRO ? 6 : (currentPhase === Phases.BUILDUP ? 4 : 8);
                if (harmonyUpdateCounter >= updateInterval) {
                    harmonyUpdateCounter = 0;
                    const roots = ['A3','F3','C4','G3','E4','D4'];
                    const types = currentPhase < Phases.BUILDUP ? ['maj7','min7'] : ['maj7','sus4','min7'];
                    const root = roots[Math.floor(currentBeat / updateInterval) % roots.length];
                    const type = types[Math.floor(Math.random() * types.length)];
                    const chord = getExtendedChord(root, type);
                    let dur = beatInterval * updateInterval;
                    let ff = 1200 + (currentPhase * 150);
                    let vel = 0.6 + (currentPhase * 0.05);
                    let qv = 0.8 + (currentPhase * 0.1);
                    if (currentPhase === Phases.OUTRO) { dur *= 1.5; vel *= 0.7; qv *= 0.6; }
                    playChord(chord, now, dur, vel, ff, qv);
                }
            }
            if (currentPhase === Phases.INTRO && elapsedTime > 25) { currentPhase = Phases.BUILDUP; phaseStartTime = now; }
            else if (currentPhase === Phases.BUILDUP && elapsedTime > 70) { currentPhase = Phases.OUTRO; phaseStartTime = now; }
            else if (currentPhase === Phases.OUTRO && elapsedTime > 130) { currentPhase = Phases.INTRO; phaseStartTime = now; currentBeat = 0; lastBeatTime = now; }
            if (trackGains.kick) {
                const pp = Math.min(1, elapsedTime / 95);
                let kt=0.2, st=0.2, ht=0.2, hyt=0.5;
                if (currentPhase === Phases.BUILDUP) { const bp = Math.min(1, (elapsedTime-25)/70); kt=0.2+bp*0.3; st=0.2+bp*0.2; ht=0.2+bp*0.15; hyt=0.5+bp*0.1; }
                else if (currentPhase === Phases.OUTRO) { const op = Math.min(1, (elapsedTime-95)/130); kt=0.5*(1-op*0.6); st=0.4*(1-op*0.5); ht=0.35*(1-op*0.5); hyt=0.6*(1-op*0.4); }
                trackGains.kick.gain.linearRampToValueAtTime(kt, now+0.1);
                trackGains.snare.gain.linearRampToValueAtTime(st, now+0.1);
                trackGains.hihat.gain.linearRampToValueAtTime(ht, now+0.1);
                trackGains.harmony.gain.linearRampToValueAtTime(Math.max(0.1,hyt+Math.sin(now*0.5)*0.03), now+0.1);
            }
            musicAnimationId = requestAnimationFrame(loop);
        }
        loop();
    }

    function stopSyntheticMusic() {
        if (!isMusicPlaying) return;

    // Find a node's full path string (used by tree) by searching treeData
    function findTreeNodePath(nodes, targetId, pathArr) {
        for (const n of nodes) {
            const cur = pathArr ? [...pathArr, n.name] : [n.name];
            if (n.id === targetId) return cur.join(' > ');
            if (n.children) {
                const found = findTreeNodePath(n.children, targetId, cur);
                if (found) return found;
            }
        }
        return null;
    }

    // Expand all tree nodes along a given path string (e.g. "注册 > 购买 > 准备")
    function expandTreePath(pathString) {
        // Split into parts and expand progressively
        const parts = pathString.split(' > ');
        let accumulated = '';
        for (let i = 0; i < parts.length; i++) {
            accumulated = accumulated ? accumulated + ' > ' + parts[i] : parts[i];
            // Find the tree-node-content with this exact data-path
            const el = document.querySelector(`.tree-node-content[data-path="${accumulated}"]`);
            if (el) {
                // Find its .tree-children sibling and open it (unless it's the leaf)
                const wrapper = el.closest('.tree-node');
                if (wrapper) {
                    const children = wrapper.querySelector('.tree-children');
                    const toggle = el.querySelector('.toggle');
                    if (children) {
                        children.classList.add('open');
                        if (toggle) { toggle.classList.add('expanded'); toggle.textContent = '▾'; }
                    }
                }
            }
        }
    }

    function performSearch() {
        const term = searchInput.value.trim().toLowerCase();
        // Clear previous search highlights from directory tree
        document.querySelectorAll('.tree-node-content').forEach(el => el.classList.remove('search-active'));
        if (!term) { searchResults = []; currentSearchIndex = -1; return; }

        const mainContent = document.getElementById('main-content');
        const cards = Array.from(mainContent.querySelectorAll('.article-card'));
        const titleMatches = [];
        const contentMatches = [];

        cards.forEach(card => {
            const taskId = card.dataset.task;
            const title = card.querySelector('h2').textContent.toLowerCase();
            const modalText = (taskModalContent[taskId] || '').toLowerCase();
            if (title.includes(term) || taskId.toLowerCase().includes(term)) {
                titleMatches.push(card);
            } else if (modalText.includes(term)) {
                contentMatches.push(card);
            }
        });

        searchResults = [...titleMatches, ...contentMatches];
        if (searchResults.length === 0) {
            const hint = document.createElement('div');
            hint.id = 'search-result-hint';
            hint.textContent = '未找到匹配的内容';
            hint.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:10001;pointer-events:none;';
            document.body.appendChild(hint);
            setTimeout(() => { if (hint.parentNode) hint.remove(); }, 2000);
            return;
        }

        // For each found task, build path set
        const pathSet = new Set();
        searchResults.forEach(card => {
            const path = findTreeNodePath(treeData, card.dataset.task, null);
            if (path) pathSet.add(path);
        });

        // Expand all ancestor nodes in directory tree
        pathSet.forEach(p => expandTreePath(p));

        // Show the FIRST match's branch content
        const firstCard = searchResults[0];
        const firstPath = findTreeNodePath(treeData, firstCard.dataset.task, null);
        if (firstPath) {
            // Highlight ALL matched leaf nodes with yellow (no ancestor highlighting)
            searchResults.forEach(card => {
                const p = findTreeNodePath(treeData, card.dataset.task, null);
                if (p) {
                    const leaf = p.split(' > ').pop();
                    document.querySelectorAll('.tree-node-content').forEach(el => {
                        const elName = el.dataset.path ? el.dataset.path.split(' > ').pop() : '';
                        if (elName === leaf && el.dataset.path === p) el.classList.add('search-active');
                    });
                }
            });

            // Show only this branch content + all matches
            document.querySelectorAll('.article-card').forEach(card => {
                card.style.display = card.dataset.task === firstCard.dataset.task ? '' : 'none';
            });
        }

        currentSearchIndex = 0;
        highlightAndFocus(searchResults[0]);
    }

    function highlightAndFocus(card) {
        // No article card highlighting — search uses directory tree yellow highlights instead
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        if (searchResults.length > 1) {
            const hint = document.createElement('div');
            hint.id = 'search-result-hint';
            hint.textContent = '搜索结果: ' + (currentSearchIndex + 1) + ' / ' + searchResults.length;
            hint.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#FFC107;padding:10px 20px;border-radius:20px;font-size:14px;z-index:10001;pointer-events:none;';
            document.body.appendChild(hint);
            setTimeout(() => { if (hint.parentNode) hint.remove(); }, 2500);
        }
    }

    // WBCCU rate limit
    const wbccuRateLimit = { timestamps: [], max: 10, windowMs: 60000 };
    function checkWbccuRateLimit() {
        const now = Date.now();
        wbccuRateLimit.timestamps = wbccuRateLimit.timestamps.filter(t => now - t < wbccuRateLimit.windowMs);
        if (wbccuRateLimit.timestamps.length >= wbccuRateLimit.max) {
            const waitSec = Math.ceil((wbccuRateLimit.windowMs - (now - wbccuRateLimit.timestamps[0])) / 1000);
            return { ok: false, waitSec };
        }
        wbccuRateLimit.timestamps.push(now);
        return { ok: true };
    }

            for (const ccy of exchangeCurrencies) {
                const sr = new RegExp('<td>' + ccy + '</td>\\s*<td>([\\d.]+)</td>\\s*<td>[\\d.]+</td>\\s*<td>([\\d.]+)</td>', 'i');
                const br = new RegExp('<td>' + ccy + '</td>\\s*<td>([\\d.]+)</td>\\s*<td>[\\d.]+</td>\\s*<td>[\\d.]+</td>\\s*<td>([\\d.]+)</td>', 'i');
                const sm = rawHtml.match(sr); const bm = rawHtml.match(br);
                if (sm && bm) rates[ccy] = { buy: parseFloat(bm[1]), sell: parseFloat(sm[2]) };
            }
            showExchangeRates(rates, modalBody);
        } catch (e) {
            modalBody.innerHTML = '<div class="tool-error">[错误] ' + e.message + '</div>';
        }
    };
</script>
</body>
</html>
