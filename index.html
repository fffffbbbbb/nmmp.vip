             height: 100%;
             width: 0px; /* 初始宽度为0 */
             background-color: #4CAF50; /* 绿色 */

             transition: none; /* 移除过渡 */

    height: 200px;
    margin-bottom: 15px;
    overflow: hidden;
    border-radius: 4px;
    /* cursor: pointer; 移除指针 */
}

.carousel-slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    /* cursor: pointer; 移除指针 */
}

.carousel-slide.active {
    opacity: 1;
}

.carousel-controls {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 5px;
}

.carousel-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
}

.carousel-dot.active {
    background-color: #fff;
}

.carousel-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 3px;
    z-index: 10;
}

.carousel-prev {
    left: 10px;
}

.carousel-next {
    right: 10px;
}

// --- 节日倒计时 ---
const festivalLimit = { key: 'sc_festival_ts', max: 10, windowMs: 3600000 };
function checkFestivalLimit() {
    const n = Date.now();
    let rec;
    try { rec = JSON.parse(localStorage.getItem(festivalLimit.key) || 'null'); } catch(e) { rec = null; }
    if (!rec || !rec.w || (n - rec.w > festivalLimit.windowMs)) rec = { w: n, c: 0 };
    if (rec.c >= festivalLimit.max) return false;
    rec.c++;
    localStorage.setItem(festivalLimit.key, JSON.stringify(rec));
    return true;
}

function nextOccurrence(month, day) {
    const now = new Date();
    let d = new Date(now.getFullYear(), month - 1, day);
    if (d <= now) d = new Date(now.getFullYear() + 1, month - 1, day);
    return d;
}

async function updateFestivalCountdown() {
    const el = document.getElementById('festival-main');
    const panel = document.getElementById('festival-status');
    if (!el) return;

    let cached = null;
    try { const c = localStorage.getItem('sc_festival_cache'); if (c) { const p = JSON.parse(c); if (Date.now() - p.t < 3600000) cached = p.d; } } catch(e) {}

    try {
        let data = cached;
        if (checkFestivalLimit()) {
            let raw = null;
            if (location.protocol !== 'file:') {
                try { const r = await fetchWithTimeout('/api/festivals', {}, 15000); if (r.ok) raw = await r.json(); } catch(_) {}
            }
            if (!raw) {
                try { const r = await fetchWithTimeout('https://eahi.org/api/eventsTracker/zh/', {}, 15000); if (r.ok) raw = await r.json(); } catch(_) {}
            }
            if (raw?.data?.length) {
                data = raw.data;
                try { localStorage.setItem('sc_festival_cache', JSON.stringify({ t: Date.now(), d: data })); } catch(e) {}
            }
        }
        if (!data?.length) { if (el.textContent.includes('加载')) el.textContent = '暂无数据'; return; }

        const now = new Date();
        const events = data.map(e => ({
            name: e.zh || e.en,
            start: new Date(e.start),
            end: new Date(e.end),
            md: { month: new Date(e.start).getMonth() + 1, day: new Date(e.start).getDate() }
        }));

        const future = events.filter(e => e.end > now).sort((a, b) => a.start - b.start);
        const past = events.filter(e => e.end <= now);

        let allItems = [];

        for (const ev of future) {
            const d = Math.ceil((ev.start - now) / (1000 * 60 * 60 * 24));
            allItems.push({ name: ev.name, days: d, predicted: false });
        }

        // 历史活动推算下次
        const seen = new Set();
        for (const ev of past) {
            const key = ev.name;
            if (seen.has(key)) continue;
            seen.add(key);
            const nd = nextOccurrence(ev.md.month, ev.md.day);
            const d = Math.ceil((nd - now) / (1000 * 60 * 60 * 24));
            allItems.push({ name: ev.name, days: d, predicted: true });
        }

        // 去重
        const futureNames = new Set(future.map(e => e.name));
        allItems = allItems.filter(item => !item.predicted || !futureNames.has(item.name));
        allItems.sort((a, b) => a.days - b.days);

        if (!allItems.length) { el.textContent = '暂无数据'; return; }

        // 主显示
        const top = allItems[0];
        el.textContent = '节日倒计时: ' + top.name + ': ' + (top.days <= 0 ? '今日' : top.days + '天');

        // tooltip 悬浮
        let tip = '';
        for (const item of allItems) {
            const s = item.days <= 0 ? '今日' : item.days + '天';
            const mark = item.predicted ? '*' : '';
            tip += item.name + mark + ': ' + s + '\n';
        }
        if (panel) panel.setAttribute('data-tip', tip.trim());
    } catch (e) {
        console.error(e);
        if (el.textContent.includes('加载')) el.textContent = '获取失败';
    }
}

document.addEventListener('DOMContentLoaded', updateFestivalCountdown);
// --- 节日倒计时结束 ---

    </script>
